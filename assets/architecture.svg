<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 224" width="100%" height="100%">
  <defs>
    <clipPath id="archClip">
      <rect width="1200" height="224" rx="16" />
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#091022" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="fbGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <style>
      .step { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
      .title { font: 700 17px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .edge-lbl { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .fb-lbl { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7dd3fc; }

      .flow-fwd {
        fill: none;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: dashFwd 1.2s linear infinite;
      }
      .flow-fb {
        fill: none;
        stroke: url(#fbGrad);
        stroke-width: 2;
        stroke-dasharray: 7 7;
        animation: dashFwd 1.8s linear infinite;
      }
      .n1 { animation: nodePulse 4.4s ease-in-out 0s infinite; }
      .n2 { animation: nodePulse 4.4s ease-in-out 1.1s infinite; }
      .n3 { animation: nodePulse 4.4s ease-in-out 2.2s infinite; }
      .n4 { animation: nodePulse 4.4s ease-in-out 3.3s infinite; }

      @keyframes dashFwd {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { stroke-opacity: 0.55; }
        20% { stroke-opacity: 1; }
        45% { stroke-opacity: 0.55; }
      }
    </style>
  </defs>

  <g clip-path="url(#archClip)">
    <rect width="1200" height="224" fill="url(#bg)" />
    <rect width="1200" height="224" fill="url(#grid)" />
  </g>
  <rect x="1" y="1" width="1198" height="222" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  
  <g>
    <path id="edge1" d="M 268 83 L 328 83" stroke="#38bdf8" class="flow-fwd" />
    <polygon points="335,83 326,78 326,88" fill="#38bdf8" />
    <text x="302" y="71" text-anchor="middle" class="edge-lbl">20-dim</text>
    <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#edge1" /></animateMotion>
    </circle>

    <path id="edge2" d="M 566 83 L 626 83" stroke="#818cf8" class="flow-fwd" />
    <polygon points="633,83 624,78 624,88" fill="#818cf8" />
    <text x="600" y="71" text-anchor="middle" class="edge-lbl">1 cell</text>
    <circle r="3.5" fill="#818cf8" filter="url(#glow)">
      <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#edge2" /></animateMotion>
    </circle>

    <path id="edge3" d="M 864 83 L 924 83" stroke="#34d399" class="flow-fwd" />
    <polygon points="931,83 922,78 922,88" fill="#34d399" />
    <text x="898" y="71" text-anchor="middle" class="edge-lbl">rad/s</text>
    <circle r="3.5" fill="#34d399" filter="url(#glow)">
      <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#edge3" /></animateMotion>
    </circle>
  </g>

  
  <g>
    <path id="fbPath" d="M 1047 136 L 1047 182 Q 1047 192 1037 192 L 163 192 Q 153 192 153 182 L 153 144" class="flow-fb" />
    <polygon points="153,137 148,146 158,146" fill="#38bdf8" />
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#fbPath" /></animateMotion>
    </circle>
    <rect x="430" y="179" width="340" height="26" rx="13" fill="#071126" stroke="#1e3a5f" />
    <text x="600" y="196" text-anchor="middle" class="fb-lbl">Encoders + Z-Gyro + 6x ToF Feedback (200 Hz)</text>
  </g>

  
  <g transform="translate(38, 30)">
    <rect width="230" height="106" rx="12" fill="url(#nodeBg)" stroke="#38bdf8" stroke-width="1.8" class="n1" />
    <circle cx="20" cy="24" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="28" class="step" fill="#38bdf8">01 · PERCEPTION</text>
    <text x="18" y="58" class="title">Local Sensors (20-Dim)</text>
    <text x="18" y="78" class="sub">4x ToF • Open Flags</text>
    <text x="18" y="95" class="sub">Visited Memory • Goal Vec</text>
  </g>

  
  <g transform="translate(336, 30)">
    <rect width="230" height="106" rx="12" fill="url(#nodeBg)" stroke="#818cf8" stroke-width="1.8" class="n2" />
    <circle cx="20" cy="24" r="4" fill="#818cf8" filter="url(#glow)" />
    <text x="32" y="28" class="step" fill="#a5b4fc">02 · HIGH-LEVEL RL</text>
    <text x="18" y="58" class="title">RecurrentPPO (LSTM)</text>
    <text x="18" y="78" class="sub">128-Unit LSTM • 341 KB</text>
    <text x="18" y="95" class="sub">Discrete(4): F / L / R / B</text>
  </g>

  
  <g transform="translate(634, 30)">
    <rect width="230" height="106" rx="12" fill="url(#nodeBg)" stroke="#34d399" stroke-width="1.8" class="n3" />
    <circle cx="20" cy="24" r="4" fill="#34d399" filter="url(#glow)" />
    <text x="32" y="28" class="step" fill="#34d399">03 · MOTION CONTROL</text>
    <text x="18" y="58" class="title">200 Hz PID Primitive</text>
    <text x="18" y="78" class="sub">90°/180° Gyro-Locked Turn</text>
    <text x="18" y="95" class="sub">0.30 m Wall-Centered Drive</text>
  </g>

  
  <g transform="translate(932, 30)">
    <rect width="230" height="106" rx="12" fill="url(#nodeBg)" stroke="#94a3b8" stroke-width="1.8" class="n4" />
    <circle cx="20" cy="24" r="4" fill="#cbd5e1" filter="url(#glow)" />
    <text x="32" y="28" class="step" fill="#cbd5e1">04 · SIM / HARDWARE</text>
    <text x="18" y="58" class="title">Differential Buggy</text>
    <text x="18" y="78" class="sub">MuJoCo / ESP32-S3 Ready</text>
    <text x="18" y="95" class="sub">r = 0.03 m • 0 Wall Hits</text>
  </g>
</svg>