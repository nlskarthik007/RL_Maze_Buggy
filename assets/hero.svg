<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <clipPath id="heroClip">
      <rect width="1200" height="320" rx="18" />
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#071126" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="80%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .title { font: 800 52px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: -1.2px; }
      .sub { font: 500 16px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.4px; }
      .wall { stroke: #334155; stroke-width: 4; stroke-linecap: round; fill: none; }
      .maze-frame { stroke: #475569; stroke-width: 3.5; fill: #04091a; }

      .trace {
        fill: none;
        stroke: url(#pathGrad);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 560;
        stroke-dashoffset: 560;
        animation: drawPath 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sensor-ray {
        fill: none;
        stroke: #f97316;
        stroke-width: 1.5;
        stroke-dasharray: 6 5;
        animation: laserPulse 1.1s ease-in-out infinite;
      }
      .code-stream {
        font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        fill: #38bdf8;
        opacity: 0;
        animation: codeFall 4.2s linear infinite;
      }
      .pulse-ring { animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .status-dot { animation: blink 1.6s ease-in-out infinite; }
      .float-y { animation: gentleFloat 3.2s ease-in-out infinite; }
      .sweep { animation: bgSweep 7s linear infinite; }

      @keyframes drawPath {
        0% { stroke-dashoffset: 560; opacity: 0.25; }
        68% { stroke-dashoffset: 0; opacity: 1; }
        90% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes laserPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.95; }
      }
      @keyframes ping {
        0% { r: 7; opacity: 0.9; stroke-width: 2.5; }
        100% { r: 30; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes gentleFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes codeFall {
        0% { transform: translateY(-16px); opacity: 0; }
        15% { opacity: 0.38; }
        85% { opacity: 0.38; }
        100% { transform: translateY(150px); opacity: 0; }
      }
      @keyframes bgSweep {
        0% { transform: translateX(-220px); opacity: 0; }
        15% { opacity: 0.08; }
        85% { opacity: 0.08; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#ambientGlow)" />
    <rect x="0" y="0" width="180" height="320" fill="#38bdf8" class="sweep" />
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5" />

  
  <g transform="translate(650, 36)">
    <text x="0" y="20" class="code-stream" style="animation-delay: 0s;">MEM: 341KB</text>
    <text x="0" y="52" class="code-stream" style="animation-delay: 1.4s;">PID: 200Hz</text>
    <text x="0" y="84" class="code-stream" style="animation-delay: 2.7s;">OBS: 20-DIM</text>
    <text x="86" y="12" class="code-stream" style="animation-delay: 0.7s;">HITS: 0</text>
    <text x="86" y="44" class="code-stream" style="animation-delay: 2.1s;">LSTM: 128</text>
    <text x="86" y="76" class="code-stream" style="animation-delay: 3.3s;">TOF: 1.2m</text>
  </g>

  
  <g transform="translate(56, 52)">
    <g class="float-y">
      <rect x="0" y="0" width="248" height="28" rx="14" fill="#0b1d33" stroke="#0284c7" stroke-opacity="0.55" />
      <circle cx="16" cy="14" r="4.5" fill="#10b981" class="status-dot" filter="url(#glow)" />
      <text x="30" y="18" class="mono" fill="#7dd3fc">ZERO-COLLISION VERIFIED</text>
    </g>

    <text x="0" y="96" class="title" fill="url(#titleGrad)" filter="url(#glow)">MAZE HIER-RL</text>
    <text x="0" y="128" class="sub">Hierarchical RecurrentPPO (LSTM) + 200 Hz Differential PID</text>
    <text x="0" y="152" class="sub" fill="#64748b">Autonomous Navigation in Unknown Procedural Mazes</text>

    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="136" height="34" rx="8" fill="#0f172a" stroke="#1e3a5f" />
      <circle cx="15" cy="17" r="3.5" fill="#38bdf8" />
      <text x="27" y="21" class="mono" fill="#38bdf8">94%+ SOLVED</text>

      <rect x="148" y="0" width="136" height="34" rx="8" fill="#05261e" stroke="#065f46" />
      <circle cx="163" cy="17" r="3.5" fill="#34d399" />
      <text x="175" y="21" class="mono" fill="#34d399">0 TICK HITS</text>

      <rect x="296" y="0" width="160" height="34" rx="8" fill="#191538" stroke="#4c1d95" />
      <circle cx="311" cy="17" r="3.5" fill="#a78bfa" />
      <text x="323" y="21" class="mono" fill="#c4b5fd">341 KB ESP32-S3</text>
    </g>
  </g>

  
  <g transform="translate(840, 40)">
    <rect x="0" y="0" width="300" height="240" rx="12" class="maze-frame" />

    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4">
      <line x1="60" y1="0" x2="60" y2="240" />
      <line x1="120" y1="0" x2="120" y2="240" />
      <line x1="180" y1="0" x2="180" y2="240" />
      <line x1="240" y1="0" x2="240" y2="240" />
      <line x1="0" y1="60" x2="300" y2="60" />
      <line x1="0" y1="120" x2="300" y2="120" />
      <line x1="0" y1="180" x2="300" y2="180" />
    </g>

    <g class="wall">
      <line x1="60" y1="0" x2="60" y2="60" />
      <line x1="60" y1="120" x2="60" y2="240" />
      <line x1="120" y1="0" x2="120" y2="60" />
      <line x1="120" y1="120" x2="120" y2="180" />
      <line x1="180" y1="0" x2="180" y2="120" />
      <line x1="180" y1="180" x2="180" y2="240" />
      <line x1="240" y1="60" x2="240" y2="240" />
      <line x1="0" y1="60" x2="180" y2="60" />
      <line x1="60" y1="120" x2="120" y2="120" />
      <line x1="120" y1="180" x2="240" y2="180" />
    </g>

    <circle cx="30" cy="210" r="6" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="270" cy="30" r="10" fill="none" stroke="#10b981" stroke-width="2" class="pulse-ring" />
    <circle cx="270" cy="30" r="7.5" fill="#10b981" filter="url(#glow)" />

    <path id="mazePath" d="M 30 210 L 30 150 L 30 90 L 90 90 L 150 90 L 150 150 L 210 150 L 210 90 L 210 30 L 270 30" class="trace" filter="url(#glow)" />

    <g>
      <line x1="0" y1="0" x2="-36" y2="0" class="sensor-ray" />
      <line x1="0" y1="0" x2="36" y2="0" class="sensor-ray" />
      <line x1="0" y1="0" x2="0" y2="-36" class="sensor-ray" />
      <circle r="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 2" />
      <circle r="6.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
      <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.68;1" calcMode="linear">
        <mpath href="#mazePath" />
      </animateMotion>
    </g>
  </g>
</svg>