<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="55%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45" />
    </pattern>

    <style>
      .title { font: 800 50px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: -1px; }
      .sub { font: 500 17px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .wall { stroke: #334155; stroke-width: 4; stroke-linecap: round; fill: none; }
      .border { stroke: #475569; stroke-width: 4; fill: #070d1f; }
      .trace {
        fill: none;
        stroke: url(#pathGrad);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 560;
        stroke-dashoffset: 560;
        animation: drawPath 6s ease-in-out infinite;
      }
      .pulse {
        transform-origin: center;
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .status-dot { animation: blink 1.8s ease-in-out infinite; }
      @keyframes drawPath {
        0% { stroke-dashoffset: 560; opacity: 0.4; }
        70% { stroke-dashoffset: 0; opacity: 1; }
        90% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes ping {
        0% { r: 8; opacity: 0.9; }
        100% { r: 22; opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  
  <rect width="1200" height="320" rx="18" fill="url(#bg)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect width="1200" height="320" rx="18" fill="url(#ambientGlow)" />
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5" />

  
  <g transform="translate(56, 62)">
    
    <rect x="0" y="0" width="232" height="28" rx="14" fill="#0f293a" stroke="#0284c7" stroke-opacity="0.5" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="status-dot" />
    <text x="30" y="18" class="mono" fill="#7dd3fc">ZERO-COLLISION VERIFIED</text>

    
    <text x="0" y="88" class="title" fill="url(#titleGrad)">MAZE HIER-RL</text>
    <text x="0" y="120" class="sub">Hierarchical RecurrentPPO + 200 Hz Differential PID</text>
    <text x="0" y="144" class="sub">Autonomous Navigation for Unknown Mazes in MuJoCo</text>

    
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="132" height="34" rx="8" fill="#111c33" stroke="#1e3a5f" />
      <text x="14" y="21" class="mono" fill="#38bdf8">94%+ SOLVED</text>

      <rect x="144" y="0" width="138" height="34" rx="8" fill="#0b2922" stroke="#065f46" />
      <text x="158" y="21" class="mono" fill="#34d399">0 TICK HITS</text>

      <rect x="294" y="0" width="152" height="34" rx="8" fill="#1c1638" stroke="#4c1d95" />
      <text x="308" y="21" class="mono" fill="#c4b5fd">341 KB ESP32-S3</text>
    </g>
  </g>

  
  <g transform="translate(830, 40)">
    <rect x="0" y="0" width="300" height="240" rx="10" class="border" />

    
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4">
      <line x1="60" y1="0" x2="60" y2="240" />
      <line x1="120" y1="0" x2="120" y2="240" />
      <line x1="180" y1="0" x2="180" y2="240" />
      <line x1="240" y1="0" x2="240" y2="240" />
      <line x1="0" y1="60" x2="300" y2="60" />
      <line x1="0" y1="120" x2="300" y2="120" />
      <line x1="0" y1="180" x2="300" y2="180" />
    </g>

    
    <g class="wall">
      <line x1="60" y1="0" x2="60" y2="60" />
      <line x1="60" y1="120" x2="60" y2="240" />
      <line x1="120" y1="0" x2="120" y2="60" />
      <line x1="120" y1="120" x2="120" y2="180" />
      <line x1="180" y1="0" x2="180" y2="120" />
      <line x1="180" y1="180" x2="180" y2="240" />
      <line x1="240" y1="60" x2="240" y2="240" />
      <line x1="0" y1="60" x2="180" y2="60" />
      <line x1="60" y1="120" x2="120" y2="120" />
      <line x1="120" y1="180" x2="240" y2="180" />
    </g>

    
    <circle cx="30" cy="210" r="6" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />

    
    <circle cx="270" cy="30" r="10" fill="none" stroke="#10b981" stroke-width="2" class="pulse" />
    <circle cx="270" cy="30" r="8" fill="#10b981" filter="url(#glow)" />

    
    <path id="mazePath" d="M 30 210 L 30 150 L 30 90 L 90 90 L 150 90 L 150 150 L 210 150 L 210 90 L 210 30 L 270 30" class="trace" filter="url(#glow)" />

    
    <g>
      <circle r="18" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 3" />
      <circle r="7.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
        <mpath href="#mazePath" />
      </animateMotion>
    </g>
  </g>
</svg>