<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <clipPath id="hudClip">
      <rect width="1200" height="220" rx="16" />
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#091022" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .val { font: 800 34px 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .lbl { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #94a3b8; }
      .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #64748b; }
      .strip { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }

      .ring-fill {
        stroke-dasharray: 176;
        stroke-dashoffset: 176;
        animation: fillRing 2.6s ease-out infinite alternate;
      }
      .pulse-ring { animation: radarPulse 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
      .wave-line {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: drawWave 2.2s linear infinite;
      }
      .bar1 { animation: barPulse 1.6s ease-in-out infinite alternate; }
      .bar2 { animation: barPulse 1.6s ease-in-out 0.25s infinite alternate; }
      .bar3 { animation: barPulse 1.6s ease-in-out 0.5s infinite alternate; }
      .bar4 { animation: barPulse 1.6s ease-in-out 0.75s infinite alternate; }
      .scan { animation: scanSweep 5.5s linear infinite; }

      @keyframes fillRing {
        0% { stroke-dashoffset: 176; }
        55%, 100% { stroke-dashoffset: 10.6; }
      }
      @keyframes radarPulse {
        0% { r: 10; opacity: 0.9; }
        100% { r: 28; opacity: 0; }
      }
      @keyframes drawWave {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes barPulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      @keyframes scanSweep {
        0% { transform: translateX(-180px); opacity: 0; }
        15% { opacity: 0.14; }
        85% { opacity: 0.14; }
        100% { transform: translateX(1240px); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#hudClip)">
    <rect width="1200" height="220" fill="url(#bg)" />
    <rect x="0" y="0" width="150" height="220" fill="#38bdf8" class="scan" />
  </g>
  <rect x="1" y="1" width="1198" height="218" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  
  <g transform="translate(24, 22)">
    <rect width="270" height="128" rx="12" fill="url(#cardBg)" stroke="#1e3a5f" />
    <text x="18" y="28" class="lbl">SOLVE RATE</text>
    <text x="18" y="74" class="val" fill="url(#cyanGrad)">94%+</text>
    <text x="18" y="98" class="sub">320 procedural 5x5 mazes</text>
    <text x="18" y="114" class="sub">~21 avg cell moves</text>
    <g transform="translate(216, 68)">
      <circle r="28" fill="none" stroke="#1e293b" stroke-width="6" />
      <circle r="28" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" transform="rotate(-90)" class="ring-fill" filter="url(#glow)" />
      <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">94%</text>
    </g>
  </g>

  
  <g transform="translate(318, 22)">
    <rect width="270" height="128" rx="12" fill="url(#cardBg)" stroke="#065f46" />
    <text x="18" y="28" class="lbl">WALL COLLISIONS</text>
    <text x="18" y="74" class="val" fill="url(#greenGrad)">0 Hits</text>
    <text x="18" y="98" class="sub">Zero physics tick contacts</text>
    <text x="18" y="114" class="sub">10-move unseen solves</text>
    <g transform="translate(216, 68)">
      <circle r="10" fill="none" stroke="#10b981" stroke-width="2" class="pulse-ring" />
      <circle r="20" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="2" />
      <path d="M -7 0 L -2 5 L 8 -6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    </g>
  </g>

  
  <g transform="translate(612, 22)">
    <rect width="270" height="128" rx="12" fill="url(#cardBg)" stroke="#0e7490" />
    <text x="18" y="28" class="lbl">PID CONTROL LOOP</text>
    <text x="18" y="74" class="val" fill="#38bdf8">200 Hz</text>
    <text x="18" y="98" class="sub">5 ms deterministic timestep</text>
    <text x="18" y="114" class="sub">6x ToF + Z-Gyro + Encoders</text>
    <g transform="translate(178, 68)">
      <line x1="0" y1="0" x2="74" y2="0" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 0 0 Q 12 -26 24 0 T 48 0 T 72 0" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" class="wave-line" filter="url(#glow)" />
    </g>
  </g>

  
  <g transform="translate(906, 22)">
    <rect width="270" height="128" rx="12" fill="url(#cardBg)" stroke="#4c1d95" />
    <text x="18" y="28" class="lbl">ACTOR FOOTPRINT</text>
    <text x="18" y="74" class="val" fill="url(#violetGrad)">341 KB</text>
    <text x="18" y="98" class="sub">85.3k FP32 LSTM params</text>
    <text x="18" y="114" class="sub">~3 ms/cell on ESP32-S3</text>
    <g transform="translate(194, 42)">
      <rect x="0" y="26" width="10" height="24" rx="3" fill="#818cf8" class="bar1" />
      <rect x="15" y="14" width="10" height="36" rx="3" fill="#a78bfa" class="bar2" />
      <rect x="30" y="6" width="10" height="44" rx="3" fill="#c084fc" class="bar3" filter="url(#glow)" />
      <rect x="45" y="18" width="10" height="32" rx="3" fill="#818cf8" class="bar4" />
    </g>
  </g>

  
  <g transform="translate(24, 166)">
    <rect width="1152" height="34" rx="8" fill="#0b132b" stroke="#1e293b" />
    <text x="576" y="21" text-anchor="middle" class="strip">
      120k Steps (~19 min CPU)   •   20-Dim Local Obs   •   4 Discrete Actions   •   0.30 m Cells   •   r = 0.03 m / L = 0.12 m   •   1.2 m ToF Cutoff
    </text>
  </g>
</svg>